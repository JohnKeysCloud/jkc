# Overrides the site's build settings in the Netlify UI, which still describe
# the v1 static site.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Declared because this site doesn't get the adapter automatically; without
# it, Netlify uploads `.next` as plain files and every page 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"
