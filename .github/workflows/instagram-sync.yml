# Mirrors new Instagram posts into the gallery once a day. Changes are
# committed to main, which Netlify deploys like any other push. See
# docs/instagram-sync.md.
name: Instagram sync

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      retry_failed:
        description: Retry posts that have failed five runs in a row
        type: boolean
        default: false

# A second run waits rather than racing the first for the same posts.
concurrency:
  group: instagram-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ISSUE_LABEL: instagram-sync
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Long-lived tokens last 60 days; refreshing daily keeps one alive
      # indefinitely. The refreshed token is masked, written back to the repo
      # secret, and handed to later steps through GITHUB_ENV.
      - name: Refresh access token
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          token_file="$RUNNER_TEMP/instagram-token"
          if npm run --silent instagram:refresh-token -- --out "$token_file"; then
            token="$(cat "$token_file")"
            echo "::add-mask::$token"
            if [ -n "$GH_TOKEN" ]; then
              gh secret set INSTAGRAM_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$token_file"
            else
              echo "::warning::SECRETS_PAT is not set, so the refreshed token wasn't saved. The stored token expires 60 days after it was issued."
            fi
          else
            echo "::warning::Token refresh failed; syncing with the stored token."
            token="$INSTAGRAM_ACCESS_TOKEN"
          fi
          rm -f "$token_file"
          echo "INSTAGRAM_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      # Carries on past failures so posts that did import still get committed.
      # Its own timeout leaves the job time to commit what a slow run saved.
      - name: Sync posts
        id: sync
        continue-on-error: true
        timeout-minutes: 15
        run: >-
          npm run --silent instagram:sync --
          --report "$RUNNER_TEMP/instagram-report.md"
          ${{ inputs.retry_failed && '--retry-failed' || '' }}

      - name: Commit and push
        if: always() && steps.sync.outcome != 'skipped'
        run: |
          git add src/content/instagram public/instagram
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: main - sync instagram posts"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail when the sync failed
        if: steps.sync.outcome == 'failure'
        run: exit 1

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/instagram-report.md"
          body="Run: $RUN_URL"
          if [ -s "$report" ]; then
            body="$body"$'\n\n'"$(cat "$report")"
          fi
          gh label create "$ISSUE_LABEL" --color FF6B6B \
            --description "Daily Instagram sync failures" 2>/dev/null || true
          issue="$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number' || true)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Instagram sync is failing" \
              --label "$ISSUE_LABEL" --body "$body"
          fi

      - name: Close resolved failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        # The label only exists once a run has failed.
        run: |
          issues="$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[].number' 2>/dev/null || true)"
          for issue in $issues; do
            gh issue close "$issue" --comment "Recovered in $RUN_URL"
          done
